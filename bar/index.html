<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הבר שלנו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: a home bar notebook. Sticky tab header, taste + pantry controls, one column of recipe cards; inventory = bottle cards with "יש / נגמר" switches. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#1B2233; --muted:#5D6578; --line:#DDE0E6;
  --ai:#2E4A8B; --ai-soft:#E3E9F6;
  --sour:#A9B51E; --sweet:#D0567A; --bitter:#B23A2A;
  --track:#E7E9EE; --warn-bg:#FFF4D6; --warn-fg:#7A5600; --ok:#2F7A4B;
  --font-display:"Karantina","Assistant","Arial Hebrew",system-ui,sans-serif;
  --font-body:"Assistant","Arial Hebrew","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151E;--surface:#1A2030;--ink:#E8EBF2;--muted:#9AA3B8;--line:#2B3346;
  --ai:#8FA9E8;--ai-soft:#24304A;--sour:#C9D445;--sweet:#EE7D9E;--bitter:#F07A63;--track:#2A3245;
  --warn-bg:#3A3112;--warn-fg:#F2D27A;--ok:#6CCB8F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151E;--surface:#1A2030;--ink:#E8EBF2;--muted:#9AA3B8;--line:#2B3346;
  --ai:#8FA9E8;--ai-soft:#24304A;--sour:#C9D445;--sweet:#EE7D9E;--bitter:#F07A63;--track:#2A3245;
  --warn-bg:#3A3112;--warn-fg:#F2D27A;--ok:#6CCB8F;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.jp{font-family:var(--font-jp);direction:ltr;unicode-bidi:isolate}
a{color:var(--ai)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;margin:0}
.unit{font-size:.8rem;color:var(--muted);text-align:left}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:1rem;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ai)}
main .wrap{padding-block:16px 48px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:.95rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[data-f="citrus"] .dot,.chip[data-f="sour"] .dot{background:var(--sour)}
.chip[data-f="sweet"] .dot,.chip[data-f="fruity"] .dot{background:var(--sweet)}
.chip[data-f="bitter"] .dot,.chip[data-f="dry"] .dot{background:var(--bitter)}
.chips.small .chip{font-size:.85rem;padding:4px 11px}
.chip .cnt{font-size:.75rem;opacity:.7;font-variant-numeric:tabular-nums}
.chip.have[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.box{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px}
.box summary{font-weight:700;cursor:pointer;font-size:.95rem}
.box summary span{font-weight:600;color:var(--ai)}
.box .chips{margin:10px 0 4px}
.groups{display:grid;gap:10px;margin:10px 0 4px}
.glbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:5px}
.box .groups .chips{margin:0}
.box .hint{font-size:.82rem;color:var(--muted);margin:6px 0 2px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.vlbl{font-weight:700;font-size:.92rem;margin-inline-end:4px}
.seg{font:inherit;font-weight:600;font-size:.9rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--ai)}
.filter-note{font-size:.88rem;color:var(--muted);margin:10px 0 0;min-height:1.3em}
.count{font-size:.85rem;color:var(--muted);margin:14px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addbtn{font:inherit;font-size:.82rem;font-weight:700;border:1.5px dashed var(--ok);color:var(--ok);background:none;border-radius:999px;padding:2px 10px;cursor:pointer}
.note{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0}

.list{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.card.missing{border-style:dashed}
.card h2{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1;margin:0;text-wrap:balance}
.card .sub{font-size:.85rem;color:var(--muted);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.abv{flex:none;text-align:center;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.75rem;color:var(--muted);line-height:1.2}
.abv b{display:block;font-size:1.1rem;color:var(--ink)}
.abv.boosted{border-color:var(--ai)} .abv.boosted b{color:var(--ai)}
.meters{display:grid;gap:6px}
.meter{display:grid;grid-template-columns:4.6rem 1fr 1.6rem;align-items:center;gap:8px;font-size:.9rem}
.meter .lbl{font-weight:600}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bar i{height:10px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.bar i span{position:absolute;inset:0 0 0 auto;width:0;background:var(--c)}
.meter .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ai-soft);color:var(--ai)}
.tag.miss{background:var(--warn-bg);color:var(--warn-fg)}
.cvod{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cvod .seg{font-size:.85rem;padding:4px 10px}
.cvod.no{font-size:.82rem;color:var(--muted)}
.ings{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ing{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;min-width:0}
.thumb{width:56px;height:76px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--ai)}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb img.crop{object-fit:cover}
.thumb svg{width:34px;height:52px}
.ing .nm{font-weight:700;line-height:1.25;min-width:0}
.ing .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.ing .nm a{font-weight:600;font-size:.8rem}
.ing.hit .nm{color:var(--ai)} .ing.hit .thumb{border-color:var(--ai);border-width:2px}
.ing.out .nm::after{content:" · אין בבית";color:var(--warn-fg);font-weight:600;font-size:.8rem}
.ing.opt .nm::after{content:" · לא חובה";color:var(--muted);font-weight:400;font-size:.8rem}
.ml{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;text-align:left;white-space:nowrap}
.ml small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);white-space:normal;max-width:7rem}
.steps{margin:0;padding-inline-start:1.2rem;display:grid;gap:4px;font-size:.95rem}
.why{font-size:.9rem;color:var(--muted);margin:0}

.bottle{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:110px 1fr;gap:14px;min-width:0}
.bottle.gone{opacity:.6}
.bottle .pic{display:grid;gap:6px;align-content:start}
.bottle .main{width:110px;height:170px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.bottle .main img{width:100%;height:100%;object-fit:contain}
.bottle .main img.crop{object-fit:cover}
.yours{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted)}
.yours img{width:34px;height:46px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.bottle .body{min-width:0;display:grid;gap:6px;align-content:start}
.bottle h4{margin:0;font-size:1.15rem;line-height:1.25}
.orig{font-size:.85rem;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.bottle p{margin:0;font-size:.93rem}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:600;font-size:.9rem}
.imgnote{font-size:.76rem;color:var(--warn-fg);background:var(--warn-bg);border-radius:6px;padding:2px 7px;justify-self:start}
.stock{justify-self:start}
h3.sec{font-family:var(--font-display);font-size:1.7rem;margin:22px 0 10px}
@media (max-width:400px){.bottle{grid-template-columns:88px 1fr}.bottle .main{width:88px;height:140px}h1{font-size:2.2rem}}
@media (prefers-reduced-motion:no-preference){.bar i span{transition:width .35s ease}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>הבר שלנו</h1>
      <div class="unit">כמויות במ״ל<br>שוט ≈ 30 מ״ל</div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-c" aria-selected="true" aria-controls="view-c">קוקטיילים</button>
      <button role="tab" id="tab-i" aria-selected="false" aria-controls="view-i">מה יש בבית</button>
    </div>
  </div>
</header>

<main>
  <section id="view-c" class="wrap" role="tabpanel" aria-labelledby="tab-c">
    <div class="chips" id="chips"></div>
    <details class="box" id="pantry"><summary>מיקסרים ופירות בבית <span id="pansum"></span></summary>
      <p class="hint">סמנו מה יש עכשיו. הבחירה נשמרת בטלפון הזה.</p>
      <div class="chips small" id="panchips"></div></details>
    <details class="box" id="ingf"><summary>סינון לפי מרכיב <span id="ingsum"></span></summary>
      <div class="groups" id="ingchips"></div></details>
    <div class="row"><label class="switch"><input type="checkbox" id="nowonly" checked> רק מה שאפשר להכין עכשיו</label></div>
    <div class="row" id="vod" role="group" aria-label="חיזוק בוודקה"></div>
    <p class="filter-note" id="fnote"></p>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="view-i" class="wrap" role="tabpanel" aria-labelledby="tab-i" hidden>
    <p class="filter-note" style="margin-top:0">בקבוק נגמר? לחצו „נגמר” והקוקטיילים שלו יוסתרו.</p>
    <div class="list" id="inv" style="gap:14px"></div>
    <h3 class="sec">מיקסרים ופירות</h3>
    <div class="list" id="mix"></div>
  </section>
</main>

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nameOf=k=>(B[k]||M[k]).he;

    can:`<svg viewBox="0 0 40 64"><rect x="10" y="10" width="20" height="46" rx="5" fill="${c}"/><rect x="12" y="6" width="16" height="6" rx="2" fill="#9AA3B8"/><circle cx="17" cy="32" r="1.6" fill="#fff"/><circle cx="23" cy="26" r="1.2" fill="#fff"/><circle cx="21" cy="40" r="2" fill="#fff"/></svg>`,

  };
  return svg[m.icon];

function bottleImg(k){
  if(M[k]) return icon(k);
  const b=B[k], crop=`img/${k}.jpg`;
  return b.img
    ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(b.img)}" alt="${esc(b.he)}" data-fallback="${crop}">`
    : `<img loading="lazy" class="crop" src="${crop}" alt="${esc(b.he)}">`;
}
document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG"&&t.dataset.fallback&&!t.dataset.failed){t.dataset.failed=1;t.src=t.dataset.fallback;t.classList.add("crop");const y=t.closest(".bottle")?.querySelector(".yours");if(y)y.hidden=true;}},true);
const abvOf=c=>{let tot=0,al=0;c.i.forEach(([k,ml])=>{tot+=ml;al+=ml*((B[k]&&B[k].abv)||0)});return tot?al/tot:0};
function meter(lbl,v,col){let cells="";for(let i=0;i<5;i++){const f=Math.max(0,Math.min(1,v-i));cells+=`<i><span style="width:${f*100}%"></span></i>`}
  return `<div class="meter"><span class="lbl">${lbl}</span><div class="bar" style="--c:var(${col})" role="img" aria-label="${lbl} ${v} מתוך 5">${cells}</div><span class="n">${v}</span></div>`}

let have=new Set(store.get("home-have",DEFAULT_HAVE).filter(k=>B[k]||M[k]));
let sel=new Set(store.get("home-filters",[]).filter(id=>FILTERS.some(f=>f.id===id&&f.test)));

const save=()=>{store.set("home-have",[...have]);store.set("home-filters",[...sel]);store.set("home-ings",[...isel]);store.set("home-vodka",vod);store.set("home-vodka-each",cv);store.set("home-nowonly",nowOnly)};

/* vodka boost: only long drinks without another strong spirit */
const STRONG=["vodka","bourbon","cognac","genepi"];
const LONG=["soda","tonic","ginger","sprite","cola","pineapple","milk"];
const canVod=c=>c.i.every(([k])=>!STRONG.includes(k))&&c.i.some(([k,ml])=>LONG.includes(k)&&ml>=90);
const vodOf=c=>(canVod(c)&&have.has("vodka"))?(c.id in cv?cv[c.id]:vod):0;
function withVod(c){const v=vodOf(c);if(!v)return c;const i=c.i.slice(),st=c.st.slice();
  const si=i.findIndex(x=>LONG.includes(x[0]));i.splice(si<0?i.length:si,0,["vodka",v]);
  st.splice(Math.max(st.length-1,1),0,`${v} מ״ל וודקה.`);return {...c,i,st,boosted:v}}
const missingOf=c=>[...new Set(withVod(c).i.filter(x=>!x[3]&&!have.has(x[0])).map(x=>x[0]))];
const uses=(c,k)=>withVod(c).i.some(x=>x[0]===k);

/* ---------- cocktails ---------- */
function card(c0){
  const c=withVod(c0),v=vodOf(c0),miss=missingOf(c0);
  const a=abvOf(c),total=c.i.reduce((s,x)=>s+x[1],0);
  const ings=c.i.map(([k,ml,lbl,opt])=>{const b=B[k],m=M[k];
    const cls=[isel.has(k)?"hit":"",opt?"opt":(!have.has(k)?"out":"")].join(" ");
    const sub=b?`${b.jp?`<span class="jp">${esc(b.orig)}</span>`:esc(b.orig)} · ${esc(b.type)}`:(m.note?esc(m.note):"");
    const amt=lbl&&!ml?`<div class="ml">${esc(lbl)}</div>`:`<div class="ml">${ml} מ״ל${lbl?`<small>${esc(lbl.replace(/^\d+ מ״ל ?/,""))}</small>`:""}</div>`;
    return `<li class="ing ${cls}"><div class="thumb">${bottleImg(k)}</div>
      <div class="nm">${esc(nameOf(k))}${sub?`<small>${sub}</small>`:""}${b&&b.info?`<a href="${esc(b.info)}" target="_blank" rel="noopener">פרטים ↗</a>`:""}</div>${amt}</li>`}).join("");
  const ctl=canVod(c0)&&have.has("vodka")
    ?`<div class="cvod" role="group" aria-label="חיזוק בוודקה למשקה הזה"><span class="vlbl">חיזוק בוודקה</span>${[0,15,30].map(x=>`<button class="seg cseg" data-id="${c0.id}" data-v="${x}" aria-pressed="${x===v}">${x?`+${x} מ״ל`:"בלי"}</button>`).join("")}</div>`
    :(canVod(c0)?"":`<div class="cvod no">לא מתאים לחיזוק בוודקה</div>`);
  const tags=[...c.t.map(t=>`<span class="tag">${TAGHE[t]}</span>`),...miss.map(k=>`<span class="tag miss">חסר: ${esc(nameOf(k))}</span>`)].join("");
  return `<article class="card${miss.length?" missing":""}">
    <div class="head"><div><h2>${esc(c.he)}</h2><div class="sub">${esc(c.en)}</div></div>
      <div class="abv${c.boosted?" boosted":""}"><b>~${a.toFixed(0)}%</b>${c.boosted?"מחוזק":"אלכוהול"}<br>${total} מ״ל</div></div>
    <div class="meters">${meter("חמיצות",c.s,"--sour")}${meter("מתיקות",c.w,"--sweet")}${meter("מרירות",c.b,"--bitter")}</div>
    ${tags?`<div class="tags">${tags}</div>`:""}
    ${ctl}
    <p class="why">${esc(c.why)}</p>
    <ul class="ings">${ings}</ul>
    <ol class="steps">${c.st.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  </article>`;
}

    return `<button class="chip" data-f="${f.id}" aria-pressed="${on}">${f.id!=="all"?'<span class="dot"></span>':''}${f.he}</button>`}).join("");

const GROUPS=[
 ["אלכוהול חזק",["vodka","bourbon","cognac","genepi"]],
 ["ליקרים וביטר",["limoncello","amaretto","choya","coco","campari"]],
 ["בסיסי סאוור (לדילול)",["lemonsour","gf","pinkgf"]],
 ["פירות ועשבים טריים",["lemon","lime","orange","mint"]],
 ["מיקסרים",["soda","tonic","ginger","sprite","cola","pineapple"]],
 ["מהמטבח",["sugar","milk","espresso"]],
];
function renderIng(){
  $("#ingchips").innerHTML=GROUPS.map(([g,ks])=>{
    const chips=ks.map(k=>{const n=C.filter(c=>uses(c,k)).length;if(!n)return"";
      return `<button class="chip" data-k="${k}" aria-pressed="${isel.has(k)}">${esc(nameOf(k))} <span class="cnt">${n}</span></button>`}).join("");
    return chips?`<div><div class="glbl">${g}</div><div class="chips small">${chips}</div></div>`:""}).join("")
    +(isel.size?`<div><button class="chip" data-k="__clear">ניקוי הבחירה</button></div>`:"");
  $("#ingsum").textContent=isel.size?"· "+[...isel].map(nameOf).join(" + "):"";
}
function renderVod(){
  if(!have.has("vodka")){$("#vod").innerHTML=`<span class="vlbl" style="color:var(--muted)">חיזוק בוודקה לא זמין: הוודקה מסומנת כנגמרה</span>`;return}
  $("#vod").innerHTML=`<span class="vlbl">חיזוק לכל המשקאות</span>`+[0,15,30].map(v=>`<button class="seg" data-v="${v}" aria-pressed="${v===vod&&!Object.keys(cv).length}">${v?`+${v} מ״ל`:"בלי"}</button>`).join("");
}
function renderList(){
  const fs=FILTERS.filter(f=>sel.has(f.id));
  let arr=C.filter(c=>[...isel].every(k=>uses(c,k)));
  if(fs.length) arr=arr.filter(c=>fs.every(f=>f.test(c))).sort((a,b)=>fs.reduce((t,f)=>t+f.sort(b)-f.sort(a),0));
  const hidden=arr.filter(c=>missingOf(c).length);
  if(nowOnly) arr=arr.filter(c=>!missingOf(c).length);
  else arr.sort((a,b)=>missingOf(a).length-missingOf(b).length);
  $("#fnote").textContent=fs.length>1?"מוצגים משקאות שמתאימים לכל הטעמים שבחרתם.":(fs[0]?fs[0].note:"אפשר לבחור כמה טעמים יחד, למשל חמוץ ופירותי.");
  let html=`<span>${arr.length} משקאות</span>`;
  if(nowOnly&&hidden.length){
    const cnt={};hidden.forEach(c=>{const m=missingOf(c);if(m.length===1)cnt[m[0]]=(cnt[m[0]]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4);
    html+=`<span>· עוד ${hidden.length} צריכים משהו שאין.</span>`+top.map(([k,n])=>`<button class="addbtn" data-k="${k}">יש ${esc(nameOf(k))}? +${n}</button>`).join("");
  }
  $("#count").innerHTML=html;
  $("#list").innerHTML=arr.length?arr.map(card).join(""):`<p class="note">אין משקה שמתאים לכל מה שבחרתם. נסו להוריד טעם או מרכיב, או לסמן מה יש בבית.</p>`;
}

$("#list").addEventListener("click",e=>{const b=e.target.closest(".cseg");if(!b)return;
  const top=b.closest(".card").getBoundingClientRect().top;cv[b.dataset.id]=+b.dataset.v;save();renderVod();renderIng();renderList();
  const again=document.querySelector(`.cseg[data-id="${b.dataset.id}"]`);if(again){const d=again.closest(".card").getBoundingClientRect().top-top;if(d)window.scrollBy(0,d)}});

/* ---------- inventory ---------- */
function bottleCard(k){
  const b=B[k],on=have.has(k);
  return `<article class="bottle${on?"":" gone"}">
    <div class="pic"><div class="main">${bottleImg(k)}</div>
      ${b.img?`<div class="yours"><img src="img/${k}.jpg" alt="">מהצילום שלכם</div>`:""}</div>
    <div class="body">
      <h4>${esc(b.he)}</h4>
      <div class="orig${b.jp?" jp":""}">${esc(b.orig)}</div>
      <div class="facts"><span class="fact">${esc(b.type)}</span><span class="fact">${b.abvTxt||b.abv+"%"}</span>${b.vol?`<span class="fact">${esc(b.vol)}</span>`:""}<span class="fact">${C.filter(c=>uses(c,k)).length} מתכונים</span></div>
      <p>${esc(b.desc)}</p>
      <p><b>טעם:</b> ${esc(b.taste)}</p>
      ${b.imgNote?`<span class="imgnote">${esc(b.imgNote)}</span>`:""}
      ${b.info||b.img?`<div class="links">${b.info?`<a href="${esc(b.info)}" target="_blank" rel="noopener">עמוד המוצר ↗</a>`:""}${b.img?`<a href="${esc(b.img)}" target="_blank" rel="noopener">תמונת הבקבוק ↗</a>`:""}</div>`:""}
      <button class="seg stock" data-k="${k}" aria-pressed="${!on}">${on?"יש בבית · לסמן נגמר":"נגמר · לסמן שיש"}</button>
    </div></article>`;
}
function mixCard(k){
  const m=M[k],on=have.has(k);
  return `<article class="bottle${on?"":" gone"}" style="grid-template-columns:56px 1fr">
    <div class="thumb">${icon(k)}</div>
    <div class="body"><h4>${esc(m.he)}</h4>${m.note?`<p>${esc(m.note)}</p>`:""}
      <div class="facts"><span class="fact">${C.filter(c=>uses(c,k)).length} מתכונים</span></div>
      <button class="seg stock" data-k="${k}" aria-pressed="${on}">${on?"יש":"אין"}</button></div></article>`;
}
function renderInv(){
  $("#inv").innerHTML=GROUPS.filter(([,ks])=>B[ks[0]]).map(([g,ks])=>`<h3 class="sec">${g}</h3>`+ks.map(bottleCard).join("")).join("");
  $("#mix").innerHTML=Object.keys(M).map(mixCard).join("");
}
$("#view-i").addEventListener("click",e=>{const b=e.target.closest(".stock");if(!b)return;const k=b.dataset.k;have.has(k)?have.delete(k):have.add(k);all()});

/* ---------- tabs ---------- */
function show(t){const c=t==="c";$("#view-c").hidden=!c;$("#view-i").hidden=c;
  $("#tab-c").setAttribute("aria-selected",c);$("#tab-i").setAttribute("aria-selected",!c);window.scrollTo(0,0)}
$("#tab-c").onclick=()=>show("c");$("#tab-i").onclick=()=>show("i");

renderChips();all();
</script>
</body>
</html>
